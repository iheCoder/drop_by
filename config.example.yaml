# 复制为 config.yaml。实际地址、额度和密钥可写在本机文件里。
# 省略的字段才由环境变量或默认值补齐。
server:
  address: 127.0.0.1:8090
  data_dir: data

search:
  base_url: https://api.deepseek.com/v1/tools
  # api_key: "在本机 config.yaml 中填写"

budget:
  weekly_usd: 20

explore_interval: 30m

models:
  providers:
    OpenAI:
      protocol: openai_responses
      base_url: https://api.openai.com/v1
      # api_key: "在本机 config.yaml 中填写"
      # 省略 api_key 时，OpenAI 条目会查 DROPBY_API_KEY、OPENAI_API_KEY。
      # 由接入点的实际能力决定。复制此条目连接其他 Responses 服务时可分别关闭。
      mid_turn_steering: true
      cache_breakpoints: true

    # 可选接入点。同一协议可用 Google 直连或支持 Gemini 原生 API 的中转站。
    # Gemini:
    #   protocol: gemini_generate_content
    #   base_url: https://generativelanguage.googleapis.com
    #   token_counting: remote  # 默认。接入点不支持 countTokens 时改为 local。
    #   api_key: "在本机 config.yaml 中填写"

  # provider 引用上面的名字；model 和 options 直接发送给该接入点。
  # context_token_budget 是 Drop By 为完整请求和输出留出的本地容量。
  scenes:
    chat:
      provider: OpenAI
      model: gpt-6.1-terra
      context_token_budget: 100000
      options:
        reasoning:
          effort: "none"
        max_output_tokens: 8000

    # 试用 Gemini 时，用下面一整段替换上面的 chat。其他场景也可独立选择。
    # 可选 model：gemini-4-hydrogen、gemini-4-argon、gemini-4-carbon、
    # gemini-3.8-flash、gemini-3.5-flash-lite。档位见 docs/model-pricing.md。
    # chat:
    #   provider: Gemini
    #   model: gemini-4-hydrogen
    #   context_token_budget: 100000
    #   options:
    #     generationConfig:
    #       thinkingConfig:
    #         thinkingLevel: low  # 五个型号都可用 low、medium、high。
    #       maxOutputTokens: 32768  # 含推理与正文。省略时 Argon/Carbon 预留 32768，其余预留 65536。
    #     toolConfig:
    #       functionCallingConfig:
    #         mode: VALIDATED  # 约束工具参数，同时保留直接回复的选择。

    research:
      provider: OpenAI
      model: gpt-6.1-sol
      context_token_budget: 100000
      options:
        reasoning:
          effort: high
        max_output_tokens: 25000

    personal_exploration:
      provider: OpenAI
      model: gpt-6.1-sol
      context_token_budget: 100000
      options:
        reasoning:
          effort: high
        max_output_tokens: 25000
        # 缓存对照可设 prompt_cache_options: {mode: explicit}，只写应用标出的历史前缀。
        # 与默认 implicit 比较时，两组均从冷缓存开始，分别记录缓存读、写和总费用。

    member_settings:
      provider: OpenAI
      model: gpt-6.1-sol
      context_token_budget: 100000
      options:
        reasoning:
          effort: low
        max_output_tokens: 8000
