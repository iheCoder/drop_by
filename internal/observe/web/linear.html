<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>列表 · 测光</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/meter.css?v=3">
  <style>
    .app { height: 100dvh; display: grid; grid-template-rows: 52px minmax(0, 1fr); }
    .body { display: grid; grid-template-columns: 248px minmax(0, 1fr) 420px; min-height: 0; }
    #list { background: var(--side); border-right: 1px solid var(--line); overflow: auto; padding: 10px 8px 24px; }
    .list-label { margin: 6px 8px 8px; color: var(--faint); font-size: 12px; }
    .item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 8px;
      color: inherit;
    }
    .item:hover { background: rgb(255 255 255 / 70%); }
    .item[aria-current="true"] { background: #fff; box-shadow: inset 2px 0 var(--sky); }
    .item b { display: block; font-weight: 600; }
    .item small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .item .num { color: var(--muted); font-size: 11px; }
    .item .num.bad { color: var(--danger); }
    #board { overflow: auto; padding: 20px 24px 32px; min-width: 0; }
    .kicker { margin: 0 0 6px; color: var(--faint); font-size: 12px; }
    #board h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.03em; }
    .dek { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
    .board { margin-top: 18px; }
    .sheet { position: relative; --gutter: 72px; }
    .ruler { position: relative; height: 36px; margin-left: var(--gutter); }
    .marks { position: relative; height: 16px; }
    .marks span {
      position: absolute; top: 0; transform: translateX(-50%);
      font-family: var(--mono); font-size: 11px; color: var(--faint);
    }
    .marks .start { transform: none; }
    .marks .end { transform: translateX(-100%); }
    .play {
      position: absolute; top: 18px; bottom: 0; width: 2px; margin-left: -1px;
      left: calc(var(--gutter) + (100% - var(--gutter)) * var(--at));
      background: var(--yellow); pointer-events: none; z-index: 3;
    }
    .play::before {
      content: ""; position: absolute; top: -5px; left: -4px; width: 10px; height: 10px;
      background: var(--yellow); border-radius: 2px;
    }
    #scrub {
      position: absolute; left: 0; right: 0; top: 14px; width: 100%; height: 16px; margin: 0;
      appearance: none; background: transparent; z-index: 4;
    }
    #scrub::-webkit-slider-runnable-track { height: 1px; background: var(--line-strong); }
    #scrub::-webkit-slider-thumb {
      appearance: none; width: 10px; height: 10px; margin-top: -5px;
      background: var(--yellow); border: 0; border-radius: 2px;
    }
    .lane { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); height: 48px; border-top: 1px solid var(--line); }
    .lane-name { display: flex; align-items: center; font-weight: 600; }
    .track { position: relative; }
    .bar {
      position: absolute; top: 14px; height: 20px; border: 0; border-radius: 4px;
      color: #fff; font-size: 11px; text-align: left; padding: 0 6px; overflow: hidden;
      z-index: 1;
    }
    .bar.ink { background: #111; }
    .bar.sky { background: var(--sky); }
    .bar.wait { background: transparent; color: var(--sky-ink); border: 1px dashed var(--sky); height: 14px; }
    .bar.quiet { background: #fff; color: var(--ink); border: 1px solid #111; }
    .bar.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--sky); }
    .tick {
      position: absolute; top: 6px; width: 8px; height: 8px; padding: 0; border: 0;
      background: #111; transform: translate(-4px, 0) rotate(45deg); z-index: 2;
    }
    .tick.steer { background: #fff; box-shadow: inset 0 0 0 1.5px #111; }
    .readout { margin: 10px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
    #detail { border-left: 1px solid var(--line); overflow: auto; padding: 20px 18px 32px; min-width: 0; }
    @media (max-width: 1080px) {
      .body { grid-template-columns: 220px minmax(0, 1fr); }
      #detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 46dvh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="/"><span>drop_by</span>测光</a>
      <nav class="switch" aria-label="原型">
        <a href="/linear.html" aria-current="page">列表</a>
        <a href="/geist.html">读数</a>
        <a href="/trace.html">痕迹</a>
      </nav>
      <button type="button" class="find" id="open-find"><span>查找</span><kbd>/</kbd></button>
    </header>
    <div class="body">
      <aside id="list"></aside>
      <main id="board"></main>
      <aside id="detail"></aside>
    </div>
  </div>
  <script src="/meter.js?v=3"></script>
  <script src="/linear.js?v=3"></script>
</body>
</html>
